<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Errol Promo Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400..600&display=block">
<!--
  Errol's promo film. Every frame is a pure function of time: renderAt(t) paints second t.
  One story, two layouts: ?format=tall (1080 × 1920, the default) or ?format=wide (1920 × 1080).
  Add &play to watch it (space pauses, click the bar to seek) or &t=9.3 to hold one frame.
  Copy and timing live in STORY, positions in LAYOUTS. render.py renders both formats and their sound.
-->
<style>
:root{--bg:#111210;--fg:#f1f0e9;--muted:#a8a79d;--gold:#edba72;--teal:#1f7a76;--ink:#1f2a33}
html,body{margin:0;background:#111210}
body.play{display:grid;place-items:center;height:100vh;overflow:hidden}
#stage{position:relative;overflow:hidden;background:var(--bg);font-family:'Geist',system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;font-kerning:normal}
.L{position:absolute;left:0;top:0}
.abs{position:absolute;left:0;top:0}

/* atmosphere */
#glow{position:absolute;left:0;top:0;width:2000px;height:2000px;border-radius:50%;background:radial-gradient(closest-side,rgba(178,134,54,.30),rgba(150,112,40,.13) 42%,rgba(120,90,30,.04) 70%,rgba(0,0,0,0) 100%)}
#grid{position:absolute;left:-40px;top:-40px;background-image:radial-gradient(rgba(206,186,150,1) 1.25px,transparent 1.7px);background-size:18px 18px;opacity:.085;-webkit-mask-image:radial-gradient(ellipse 58% 42% at 50% 50%,#000 10%,transparent 100%)}
#orbit{position:absolute;border-radius:50%;border:1.5px solid rgba(217,177,107,.11)}
#vig{background:radial-gradient(ellipse 85% 72% at 50% 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.6) 100%);pointer-events:none}
#grain{opacity:.075;mix-blend-mode:overlay;pointer-events:none;background-size:256px 256px}

/* app windows */
.win{position:absolute;border-radius:30px;background:#1b1c1a;box-shadow:0 0 0 1px rgba(255,255,255,.075),0 1px 0 rgba(255,255,255,.06) inset,0 44px 90px rgba(0,0,0,.55),0 10px 24px rgba(0,0,0,.35);overflow:hidden;transform-origin:50% 50%}
.titlebar{position:absolute;left:0;top:0;width:100%;height:60px;border-bottom:1px solid rgba(255,255,255,.055);background:rgba(255,255,255,.012)}
.lights{position:absolute;left:24px;top:23px;display:flex;gap:10px}
.lights i{width:14px;height:14px;border-radius:50%;display:block;background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.wtitle{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;justify-content:center;gap:11px;font-size:24px;font-weight:600;color:#e9e8e1;letter-spacing:-.01em}
.wtitle img{width:32px;height:32px}
.thread{position:absolute;left:0;top:60px;overflow:hidden}
.set{position:absolute;left:0;top:0;width:100%;height:100%}
.page{position:absolute;left:0;top:0}
.via{position:absolute;right:40px;top:4px;display:flex;align-items:center;gap:8px;font:500 18px 'Geist Mono',monospace;letter-spacing:.06em;color:#8b8a81;text-transform:uppercase}
.via svg{width:20px;height:20px}
.bubble{position:absolute;right:36px;top:32px;padding:13px 24px;background:#2d2e2b;border-radius:28px;font-size:30px;line-height:36px;color:#ecebe4;letter-spacing:-.01em;box-sizing:border-box}
.btext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnote{display:flex;align-items:center;gap:9px;font-size:23px;line-height:30px;color:var(--gold);white-space:nowrap;margin-bottom:2px}
.bnote svg{width:20px;height:20px}
.reply{position:absolute;left:36px;top:122px;font-size:34px;line-height:44px;color:#f1f0e9;letter-spacing:-.015em;white-space:nowrap}
.rw{display:inline-block;white-space:pre}
.think{position:absolute;left:40px;top:140px;display:flex;gap:9px}
.think i{width:11px;height:11px;border-radius:50%;background:#8f8e86;display:block}
.copy{position:absolute;left:36px;top:184px;height:32px;display:flex;align-items:center;gap:9px;font-size:22px;color:#8f8e86;transform-origin:0 50%}
.copy svg{width:24px;height:24px}
.copy.on{color:var(--gold)}
.composer{position:absolute;left:24px;right:24px;height:64px;border-radius:32px;background:#242523;box-shadow:0 0 0 1px rgba(255,255,255,.07)}
.ph,.ctext{position:absolute;left:28px;top:0;height:64px;line-height:64px;font-size:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph{color:#77766f}.ctext{color:#ecebe4}
.send{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;background:#3a3b38;display:grid;place-items:center}
.send svg{width:22px;height:22px}
.cglow{position:absolute;left:-3px;top:-3px;right:-3px;bottom:-3px;border-radius:35px;box-shadow:0 0 0 2.5px rgba(242,196,120,.95),0 0 30px rgba(237,186,114,.55);opacity:0}
#stage.wide .btext,#stage.wide .reply{white-space:normal}

/* Errol's console */
#console{position:absolute;background:linear-gradient(#efece7,#e8e5df);box-shadow:0 0 0 1px rgba(255,255,255,.45) inset,0 0 0 1px rgba(0,0,0,.25),0 34px 80px rgba(0,0,0,.55),0 8px 22px rgba(0,0,0,.3)}
.cicon{position:absolute;left:0;top:0;width:124px;height:124px;transform-origin:0 0}
.cicon img{width:124px;height:124px;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.18))}
.badge{position:absolute;right:-4px;bottom:-4px;width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 4px #ece9e4;display:grid;place-items:center}
.badge svg{width:24px;height:24px}
.b-ready{background:#34c759}.b-speak{background:var(--teal)}.b-wait{background:#8e8c87}
.clbl{position:absolute;left:0;top:0;font-size:25px;font-weight:600;color:#26241f;white-space:nowrap;letter-spacing:-.01em}
#chips{position:absolute;left:0;top:26px;display:flex;gap:30px;font-size:23px;color:#57544f;white-space:nowrap;align-items:center}
#chips span{display:flex;align-items:center;gap:7px}
#chips svg{width:20px;height:20px}
#cbox{position:absolute;background:#fbfaf8;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.06);overflow:hidden}
#cbox .abs{white-space:nowrap}
#ptext{font-size:34px;line-height:42px;color:var(--ink);letter-spacing:-.015em}
.caret{display:inline-block;width:3px;height:38px;background:var(--teal);vertical-align:-7px;margin-left:2px;border-radius:2px}
.tbtn{position:absolute;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--teal);color:#fff;font-weight:600;border-radius:999px;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 4px 12px rgba(31,122,118,.35)}
.tbtn svg{width:26px;height:26px}
#startBtn{width:244px;height:70px;font-size:27px}
#sendBtn{width:316px;height:56px;font-size:23px;gap:9px}
#sendBtn svg{width:22px;height:22px}
.roll{position:absolute;left:0;top:0;height:44px;width:420px;overflow:hidden}
.roll span{position:absolute;left:0;top:0;white-space:nowrap}
#stTitle{height:40px}
#stTitle span{font-size:29px;line-height:40px;font-weight:600;color:var(--ink);letter-spacing:-.015em}
#stTurn{top:44px;height:32px}
#stTurn span{font-size:23px;line-height:32px;color:#6b6964}
#stReceipt{top:80px;font-size:22px;line-height:30px;color:#6b6964;display:flex;align-items:center;gap:7px}
#stReceipt svg{width:20px;height:20px}
.rbtn{position:absolute;width:62px;height:62px;border-radius:50%;display:grid;place-items:center}
#pauseBtn{background:var(--teal);box-shadow:0 3px 10px rgba(31,122,118,.35)}
#stopBtn{background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.12),0 2px 5px rgba(0,0,0,.08)}
#ntext{font-size:30px;line-height:40px;color:var(--ink);letter-spacing:-.012em}
#nph{font-size:30px;line-height:40px;color:#9a9892}
#sheen{position:absolute;top:0;left:0;width:260px;height:100%;background:linear-gradient(100deg,rgba(255,214,140,0) 0%,rgba(255,206,120,.35) 50%,rgba(255,214,140,0) 100%);opacity:0}
#cring{position:absolute;inset:0;border-radius:32px;box-shadow:0 0 0 3px var(--teal) inset;opacity:0}

/* menu bar */
#menubar{position:absolute;width:580px;height:64px;border-radius:18px;background:rgba(255,255,255,.07);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%)}
#mbcap{position:absolute;width:74px;height:48px;border-radius:24px;background:rgba(255,255,255,.2)}
#mbitems{position:absolute;height:64px}
#mbclock{position:absolute;top:0;height:64px;line-height:64px;font-size:25px;font-weight:500;color:#e6e5de;letter-spacing:-.005em;white-space:nowrap}

/* logo */
#sym,#sym2{position:absolute;left:0;top:0;overflow:visible;transform-origin:0 0}
.wordmark{position:absolute;left:0;text-align:center;font-size:150px;line-height:1;font-weight:650;letter-spacing:-.06em;color:var(--fg);white-space:nowrap}
.wordmark .m{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .015em .16em;margin-bottom:-.16em}
.wordmark .m span{display:inline-block}
.wdot{display:inline-block;width:.16em;height:.16em;border-radius:50%;background:var(--gold);margin-left:.04em;vertical-align:baseline;box-shadow:0 0 30px rgba(237,186,114,.45);transform-origin:50% 100%}
#stage.wide .wordmark{font-size:130px}

/* captions */
.cap{position:absolute;left:0;text-align:center}
.eyebrow{position:absolute;left:0;display:flex;justify-content:center;align-items:center;gap:16px;font:500 24px 'Geist Mono',monospace;letter-spacing:.2em;color:#b3b2a5;text-transform:uppercase}
.eyebrow .num{color:var(--gold)}
.eyebrow .rule{width:44px;height:1.5px;background:linear-gradient(90deg,var(--gold),rgba(237,186,114,.2))}
.hl{position:absolute;left:0;text-align:center;font-size:84px;line-height:88px;font-weight:560;letter-spacing:-.042em}
.hl-line{white-space:nowrap}
.hl-line.dim{color:var(--muted)}
.m{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .03em .14em;margin:0 -.03em -.14em}
.m .wi{display:inline-block}
.tag{font-size:64px;line-height:70px;font-weight:540;letter-spacing:-.045em}
#endHl{font-size:88px;line-height:92px;font-weight:560;letter-spacing:-.05em}
#stage.wide .hl{font-size:72px;line-height:80px}
#stage.wide .hl-line{display:inline}
#stage.wide .tag{font-size:56px;line-height:64px}
#stage.wide #endHl{font-size:78px;line-height:86px}

/* cursor and keystrokes */
#cursor,.ghost{position:absolute;left:0;top:0;width:44px;height:64px;transform-origin:3px 3px}
#cursor svg,.ghost svg{width:44px;height:64px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.ripple{position:absolute;left:0;top:0;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;border:3px solid rgba(255,255,255,.9)}
.key svg{width:.78em;height:.78em;flex:none}.key svg.ret{width:1.02em;height:1.02em}
.key{position:absolute;left:0;top:0;height:92px;width:108px;box-sizing:border-box;border-radius:22px;background:linear-gradient(#34352f,#262723);box-shadow:0 0 0 1.5px rgba(255,255,255,.14) inset,0 -3px 0 rgba(0,0,0,.35) inset,0 12px 26px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:4px;font-size:36px;font-weight:600;color:#f1f0e9;white-space:nowrap}

/* end card */
#pill{position:absolute;left:0;top:0;display:flex;align-items:center;gap:14px;padding:0 26px;height:58px;border-radius:29px;box-shadow:0 0 0 1.5px rgba(255,255,255,.1) inset;background:rgba(255,255,255,.035);font:500 24px 'Geist Mono',monospace;letter-spacing:.16em;color:#bdbcb1;white-space:nowrap;text-transform:uppercase}
#pill i{width:9px;height:9px;border-radius:50%;background:#34c759;box-shadow:0 0 10px rgba(52,199,89,.6);display:block}
#pill b{font-weight:500;color:#6d6c64}
#cta{position:absolute;left:0;top:0;height:92px;padding:0 46px;border-radius:24px;display:flex;align-items:center;gap:14px;background:var(--gold);color:#201a12;font-size:40px;font-weight:650;letter-spacing:-.03em;box-shadow:0 0 0 1px #f5cb8d inset,0 1px 0 rgba(255,255,255,.35) inset,0 0 60px rgba(237,186,114,.25),0 16px 40px rgba(0,0,0,.4);overflow:hidden;white-space:nowrap}
#ctaSheen{position:absolute;top:0;left:0;width:160px;height:100%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0))}

/* preview chrome, outside the stage */
#bar{position:fixed;left:0;right:0;bottom:0;height:34px;background:#000a;display:none;color:#ddd;font:12px monospace;cursor:pointer}
body.play #bar{display:block}
#bar div{position:absolute;left:0;top:0;height:100%;background:#edba7255}
#bar span{position:absolute;right:10px;top:9px}
</style>
</head>
<body>
<div id="stage">
  <div class="L" id="bgL"><div id="glow"></div><div id="grid"></div><div id="orbit"></div></div>
  <div class="L" id="cam"></div>
  <div class="L" id="hud"></div>
  <canvas class="L" id="fxHud"></canvas>
  <div class="L" id="vig"></div>
  <div class="L" id="grain"></div>
</div>
<div id="bar"><div></div><span></span></div>
<script>
'use strict';
// ================================================================== STORY
// Shared by both formats. Times are seconds; positions live in LAYOUTS.
const DUR=23;
const NAME={A:'ChatGPT',B:'Claude'};         // A is the upper (tall) or left (wide) app

// Scene beats. The renderers time most secondary motion as offsets from these.
const BEAT={
  hookOut:2.3,        // the hook's caption leaves and the apps step back
  swap:2.9,           // behind the blur, both chats start fresh for the relay
  pen:{f0:2.52,f1:3.08,h1:3.17,r1:3.5,land:3.86}, // the dot draws the front bubble, hops, draws the rear one, lands as the period
  wordmarkIn:3.36, taglineIn:3.98, revealOut:5.64,
  toMenuBar:5.78,     // the symbol shrinks into the menu bar
  glyphPress:6.12,    // its status item is pressed
  drop:6.16,          // the console drops from it
  readyA:6.44, readyB:6.56,
  topic:[6.6,7.5],    // typing the topic
  start:8.32,         // Start relay
  morph:8.45,         // the console compacts and the apps come forward
  run:8.7,            // the status line starts
  pause:14.67,
  note:[15.2,15.92],  // typing the note
  send:16.25,         // Send note & continue
  receipt:16.96,
  endRecede:18.7,
  meet:19.02,         // the symbol's two bubbles meet
  courier:{go:18.88,land:19.62}, // the dot rises from the console and lands as the period
  wordmark2:19.22, endLine:19.7, pill:20.02, cta:20.22, sheen:20.95,
};
const TOPIC='Price by seat or by usage?';
const TURN_LIMIT=10;
const SEND_DELAY=.07;   // a delivery lands, is pasted, and is sent this much later

// The hook: you, relaying by hand. A page slides into a chat at t and its reply streams from rs to re.
const HOOK={
  A:{pages:[
      {t:-99,bubble:'Can you review my launch plan?',reply:'Solid. Tighten step two.',rs:-99,re:-98.5},
      {t:1.42,bubble:'Done. Step two is tighter.',reply:'Better. Now fix step three.',rs:1.47,re:1.66}],
    pastes:[{text:'Done. Step two is tighter.',tp:1.3,ts:1.4}],
    copies:[.24,1.72]},
  B:{pages:[
      {t:-99,bubble:'Draft a launch plan.',reply:'Here’s a three-step plan.',rs:-99,re:-98.5},
      {t:.68,bubble:'Solid. Tighten step two.',reply:'Done. Step two is tighter.',rs:.74,re:.95},
      {t:2.05,bubble:'Better. Now fix step three.',reply:'On it. And step one…',rs:2.1,re:2.3}],
    pastes:[{text:'Solid. Tighten step two.',tp:.54,ts:.66},{text:'Better. Now fix step three.',tp:1.95,ts:2.03}],
    copies:[1.02]},
  keys:[{t:.24,label:'⌘C'},{t:.54,label:'⌘V'},{t:.66,label:'↩'},{t:1.02,label:'⌘C'},{t:1.3,label:'⌘V'},{t:1.4,label:'↩'},{t:1.72,label:'⌘C'},{t:1.95,label:'⌘V'},{t:2.03,label:'↩'}],
};

// The relay, hop by hop: Errol copies at t0, the message lands at t1, and the reply streams from rs to re.
// The first hop carries the topic; each later hop carries the previous reply. A hop with a note carries it too.
const HOPS=[
  {from:'console',to:'A',t0:9.02,t1:9.48,reply:'Per seat. Buyers can predict the bill.',rs:9.8,re:10.35},
  {from:'A',to:'B',t0:10.42,t1:11.02,reply:'Seats punish light users. Cap usage instead.',rs:11.3,re:11.8},
  {from:'B',to:'A',t0:11.85,t1:12.38,reply:'Fair. A seat floor, plus usage?',rs:12.57,re:12.95},
  {from:'A',to:'B',t0:13,t1:13.48,reply:'Yes, if the allowance covers most teams.',rs:13.65,re:14.34},
  {from:'B',to:'A',t0:16.32,t1:16.9,note:'Make the case for startups.',reply:'For startups: a free tier, then usage.',rs:17.12,re:17.68},
];

// Captions rise word by word at tin and leave at tout. Leave 0.35 s between one's tout and the next one's tin.
const CAPTIONS=[
  {lines:['Still copy-pasting','between your AIs?'],dim:[1],tin:-.3,tout:BEAT.hookOut},
  {lines:['Give them a topic.'],tin:6.12,tout:8.38},
  {lines:['Errol carries','every reply.'],dim:[1],tin:8.74,tout:11.4},
  {lines:['No API keys.','Just your Mac apps.'],dim:[1],tin:11.76,tout:14.16},
  {lines:['Step in whenever','you like.'],dim:[1],tin:14.6,tout:18.5},
];
const EYEBROWS=[{num:'01',label:'Topic',tin:6.08,tout:8.38},{num:'02',label:'Relay',tin:8.7,tout:14.2},{num:'03',label:'Steer',tin:14.56,tout:18.5}];
const TAGLINE={lines:['Let ChatGPT and Claude','talk it out.'],dim:[0]};
const END_LINE='Let your AIs talk.';
const PILL=['Free','Open source','For Mac'];
const CTA='errol.chat';

// The cursor: [t, target, dx, dy]. Targets are named spots the layout resolves; 'aside.*' offsets are per layout.
const CURSOR=[
  [0,'A.copy',492,-130],[.22,'A.copy',2,3],[.52,'B.paste'],[.72,'B.paste'],[.98,'B.copy',2,3],[1.28,'A.paste'],[1.44,'A.paste'],
  [1.66,'A.copy',2,3],[1.93,'B.paste'],[2.12,'B.paste',10,-7],[2.34,'B.paste',60,-52],[2.62,'hookExit'],
  [BEAT.start-.62,'enter'],[BEAT.start-.06,'start'],[BEAT.start+.1,'start',6,6],[BEAT.start+.48,'aside.start'],
  [BEAT.pause-.47,'enter'],[BEAT.pause-.04,'pause'],[BEAT.pause+.15,'pause',13,10],[BEAT.pause+.53,'aside.pause'],
  [BEAT.send-.37,'aside.pause'],[BEAT.send-.05,'send'],[BEAT.send+.09,'send',4,6],[BEAT.send+.45,'aside.send'],
];
const CURSOR_SHOWN=[[-1,-1,BEAT.hookOut,BEAT.hookOut+.3],[BEAT.start-.62,BEAT.start-.62,BEAT.start+.23,BEAT.start+.48],[BEAT.pause-.47,BEAT.pause-.47,BEAT.send+.17,BEAT.send+.45]];
const CLICKS=[.24,.54,1.02,1.3,1.72,1.95,BEAT.start,BEAT.pause,BEAT.send];

// ---------------------------------------------------------------- derived from HOPS
const RELAY={A:{pages:[{t:-99,blank:true}],pastes:[],copies:[]},B:{pages:[{t:-99,blank:true}],pastes:[],copies:[]}};
const FLIGHTS=[];
const STATUS=[{t:BEAT.run,text:`Introducing ${NAME[HOPS[0].to]}…`}];
const TURNS=[{t:BEAT.run,text:`Turn 1 of ${TURN_LIMIT}`}];
const SPEAK=[{t:BEAT.run,w:HOPS[0].to},{t:BEAT.pause+.01,w:'-'}];
let NOTE_HOP=null;
HOPS.forEach((h,k)=>{
  const carried=k?HOPS[k-1].reply:TOPIC, ts=h.t1+SEND_DELAY;
  FLIGHTS.push({t0:h.t0,t1:h.t1,from:h.from,to:h.to,kind:h.from==='console'?'seed':'hop',delivery:k});
  if(h.note){FLIGHTS.push({t0:h.t0+.12,t1:h.t1,from:'console',to:h.to,kind:'note',delivery:k});NOTE_HOP={...h,turn:k+1}}
  if(h.from!=='console'){RELAY[h.from].copies.push(h.t0);STATUS.push({t:h.t0,text:`Carrying to ${NAME[h.to]}…`})}
  RELAY[h.to].pastes.push({text:h.note?`${h.note} ${carried}`:carried,tp:h.t1,ts,gold:true});
  RELAY[h.to].pages.push({t:ts,via:true,note:h.note,bubble:carried,reply:h.reply,rs:h.rs,re:h.re});
  STATUS.push({t:h.t1,text:`${NAME[h.to]} is replying…`});
  if(k){TURNS.push({t:h.t1,text:`Turn ${k+1} of ${TURN_LIMIT}`});SPEAK.push({t:h.t1,w:h.to})}
});
[STATUS,TURNS,SPEAK].forEach(a=>a.sort((x,y)=>x.t-y.t));
const NOTE=NOTE_HOP?NOTE_HOP.note:'';

// ================================================================== LAYOUTS
const LAYOUTS={
  tall:{
    W:1080,H:1920,

  const pl=P(t,BEAT.pill,BEAT.pill+.58,E.expo);S(pill,{y:(1-pl)*26,o:pl});
  const cz=spring(t-BEAT.cta,13,.55);S(cta,{y:(1-clamp(cz))*30,s:.94+.06*cz,o:P(t,BEAT.cta,BEAT.cta+.2,E.lin)});
  const shx=P(t,BEAT.sheen,BEAT.sheen+.7,E.io2);ctaSheen.style.transform=`translateX(${(-180+(cta.offsetWidth+200)*shx).toFixed(1)}px)`;ctaSheen.style.opacity=shx>0&&shx<1?1:0;
}

function renderCaptions(t){
  CAPS.forEach(c=>renderWords(c.h.words,t,c.tin,c.tout));
  EB.forEach(e=>{const a=P(t,e.tin,e.tin+.45,E.out3);S(e.el,{y:(1-a)*14,o:a*(1-P(t,e.tout,e.tout+.25,E.in2))})});
}

function renderBG(t){
  // the glow breathes and follows each scene's focus
  const h=BEAT.hookOut, r=BEAT.toMenuBar+.02, e=BEAT.endRecede, F=L.focus;
  const fy=t<h+.1?F.hook:t<r?lerp(F.hook,F.reveal,P(t,h,h+.9)):t<BEAT.run-.1?lerp(F.reveal,F.setup,P(t,r,r+.6)):t<e?lerp(F.setup,F.relay,P(t,BEAT.morph,BEAT.morph+.6)):lerp(F.relay,F.end,P(t,e,e+.7));
  const inten=.55+.45*P(t,h,h+1.1)*(1-P(t,r,r+1.2))+.25*P(t,BEAT.morph+.35,BEAT.morph+.95)*(1-P(t,e-.3,e+.2))+.5*P(t,e+.1,e+1.1)+.04*Math.sin(t*1.7);
  S($('#glow'),{x:L.W/2-1000,y:fy-1000,s:.92+.08*Math.sin(t*.6),o:clamp(inten)});
  $('#grid').style.transform=`translateY(${(-(t*9)%18).toFixed(2)}px)`;
  S($('#orbit'),{r:-8+t*1.1,o:.8+.2*Math.sin(t)});
  const fr=Math.round(t*60);$('#grain').style.backgroundPosition=`${(fr*97)%256}px ${(fr*61)%256}px`;
}

function camera(t){
  // gentle push-ins, back to neutral wherever camera space and HUD space must line up
  const s=1+.022*P(t,0,BEAT.hookOut,E.io2)*(1-P(t,BEAT.hookOut,BEAT.swap,E.io3))+.035*P(t,BEAT.morph+.45,BEAT.pause-.07,E.io2)*(1-P(t,BEAT.endRecede-.7,BEAT.endRecede+.3,E.io3));
  cam.style.transformOrigin=`${L.camera[0]}px ${L.camera[1]}px`;
  cam.style.transform=`scale(${s.toFixed(5)})`;
}

const cA=fxCam.getContext('2d'), cH=$('#fxHud').getContext('2d');
function render(t){
  camera(t);renderBG(t);
  // the apps: hook, step back for the reveal and setup, come forward for the relay, step back for the end card
  const k=P(t,BEAT.hookOut+.04,BEAT.hookOut+.65,E.io3)*(1-P(t,BEAT.morph,BEAT.morph+.57,E.io3));
  const endRec=P(t,BEAT.endRecede,BEAT.endRecede+.5,E.io3);
  const [rx,ry]=L.win.recede, d=60*k+40*endRec;
  const fx=dir=>({x:dir*rx*d,y:dir*ry*d,s:1-.1*k-.08*endRec,o:1-.93*k-endRec,blur:16*k+10*endRec});
  renderWin(WIN.A,t,fx(-1));renderWin(WIN.B,t,fx(1));
  renderConsole(t);renderCursor(t);renderLogo(t);renderCaptions(t);
  cA.clearRect(0,0,L.W,L.H);cH.clearRect(0,0,L.W,L.H);
  for(const f of FLIGHTS)comet(cA,pathPos(f.path,f.t0,f.t1),t,f.t0,f.t1);
  comet(cH,penPos,t,BEAT.pen.f0-.02,BEAT.pen.land,{trail:.08,size:.95,ring:false,linger:.2});
  comet(cH,endPos,t,BEAT.courier.go,BEAT.courier.land,{trail:.16,ring:false,linger:.2});
}

// ================================================================== boot
window.renderAt=t=>render(t);
async function boot(){
  for(const f of ['560 84px Geist','650 150px Geist','400 30px Geist','600 30px Geist','500 24px "Geist Mono"'])await document.fonts.load(f);
  await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
  measure();render(0);
  // everything the sound design syncs to, for render.py
  window.CUES={format:FORMAT,W:L.W,H:L.H,dur:DUR,beat:BEAT,
    hook:{keys:HOOK.keys.map(k=>k.t),clicks:CLICKS.filter(c=>c<BEAT.hookOut),sends:[...HOOK.A.pastes,...HOOK.B.pastes].map(p=>p.ts).sort((a,b)=>a-b)},
    typing:{topic:TOPIC.length,note:NOTE.length},
    flights:FLIGHTS.map(f=>({t0:f.t0,t1:f.t1,kind:f.kind,delivery:f.delivery,path:f.path})),
    copies:[...RELAY.A.copies,...RELAY.B.copies].sort((a,b)=>a-b),
    sends:[...RELAY.A.pastes,...RELAY.B.pastes].map(p=>p.ts).sort((a,b)=>a-b),
    console:CC,glyph:L.glyph,reveal:[R.cx,R.cy],wordmarkDots:[WM1_DOT,WM2_DOT]};
  window.__ready=true;
  const q=new URLSearchParams(location.search);
  if(q.has('t'))render(parseFloat(q.get('t')));
  if(q.has('play')){
    document.body.classList.add('play');
    const fit=()=>{const k=Math.min((innerHeight-40)/L.H,innerWidth/L.W);stage.style.transform=`scale(${k})`;stage.style.transformOrigin='50% 50%'};fit();addEventListener('resize',fit);
    let t0=performance.now(),paused=false,tp=0;
    addEventListener('keydown',e=>{if(e.key===' '){paused=!paused;if(!paused)t0=performance.now()-tp*1000}});
    $('#bar').addEventListener('click',e=>{tp=e.clientX/innerWidth*DUR;t0=performance.now()-tp*1000;render(tp)});
    const loop=()=>{if(!paused)tp=((performance.now()-t0)/1000)%DUR;render(tp);$('#bar div').style.width=(tp/DUR*100)+'%';$('#bar span').textContent=`${FORMAT} · ${tp.toFixed(2)}s`;requestAnimationFrame(loop)};loop();
  }
}
boot();
</script>
