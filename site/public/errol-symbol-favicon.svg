<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="9.75 10.75 58.5 58.5" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Errol symbol</title>
  <desc id="desc">Errol's two speech bubbles on a square canvas, in a color that follows the browser's light or dark appearance.</desc>

  <style>
    @media (prefers-color-scheme: dark) {
      path { stroke: #f4f0e6; }
    }
  </style>

  <g stroke="#343633" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rear bubble: its right side and bottom, tail at the lower right -->
    <path d="M 59 32 C 67 39 68 51 61 60 L 66 67 H 47 C 40.5 67 35.5 64.5 31 60"/>
    <!-- Front bubble: tail at the lower left -->
    <path d="M 18 47 C 14.2 43.4 12 38.4 12 33 C 12 21.95 20.95 13 32 13 C 43.05 13 52 21.95 52 33 C 52 44.05 43.05 53 32 53 H 12 Z"/>
  </g>
</svg>
