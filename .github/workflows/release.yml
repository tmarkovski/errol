name: Release

# Pushing a v* tag builds Errol, signs it with Developer ID, notarizes it,
# checks it, and publishes it as a prerelease on GitHub. Installed copies don't
# see a prerelease: their feed, errol.chat/appcast.xml, redirects to the feed
# in the latest release, and GitHub never counts a prerelease as the latest.
#
# That leaves room to try the update on a real Mac before anyone else gets it.
# Point a copy of Errol at the prerelease's own feed, check for updates, and
# confirm the Accessibility grant survived and a relay still runs:
#
#   defaults write com.t7m8.Errol SUFeedURL https://github.com/tmarkovski/errol/releases/download/vX.Y.Z/appcast.xml
#
# (and `defaults delete com.t7m8.Errol SUFeedURL` afterwards). Then approve the
# publish job, which makes the prerelease the latest release. From that moment
# every installed copy is offered the update.
#
# Run by hand from the Actions tab, it's a dry run: it builds with ad hoc
# signing, needs no credentials, and keeps the app, ZIP, and DMG as workflow
# artifacts instead of making a release.
#
# scripts/release/release.py does the work in each step, so every step can also
# be run on a Mac.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Actions are pinned to commits, since this workflow handles the signing
# secrets. The comment beside each names the release it came from.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: Errol
  # Pinned deliberately: the runner image also carries betas, and a release
  # shouldn't be built with one. Change it as a reviewed change.
  XCODE: /Applications/Xcode_27.0.app

jobs:
  build:
    name: Build, sign, notarize
    runs-on: xcode-27
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      # fetch-depth: 0 is required, not cosmetic. The build number is the
      # commit count, and a shallow checkout would make it 1 on every release,
      # a CFBundleVersion that never advances and a feed that never offers an
      # update.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE"
          xcodebuild -version

      # Tests run before anything is signed. A build that fails its own
      # detection tests has no business being notarized.
      - name: Run contract tests
        run: swift test

      - name: Derive version numbers
        id: version
        run: |
          set -euo pipefail
          BUILD="$(git rev-list --count HEAD)"
          if [[ "$BUILD" -le 1 ]]; then
            echo "::error::Build number is $BUILD, so the checkout is shallow. fetch-depth: 0 is missing."
            exit 1
          fi

          if [[ "$RELEASE" == "true" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME isn't a version like v1.2.3."
              exit 1
            fi
            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME isn't on main. Releases are cut from main."
              exit 1
            fi
          else
            VERSION="0.0.0"
          fi

          # Sparkle compares build numbers. A release that doesn't exceed the
          # published one would never be offered to anyone.
          LATEST="$(curl -fsSL https://errol.chat/appcast.xml 2>/dev/null \
            | grep -oE '<sparkle:version>[0-9]+</sparkle:version>' \
            | grep -oE '[0-9]+' | sort -n | tail -1 || true)"
          if [[ -n "$LATEST" && "$BUILD" -le "$LATEST" ]]; then
            echo "::error::Build $BUILD doesn't exceed the published build $LATEST."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (build $BUILD). The published build is ${LATEST:-none}."

      - name: Import the Developer ID certificate
        if: env.RELEASE == 'true'
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        run: |
          uv run scripts/release/release.py archive \
            --version "${{ steps.version.outputs.version }}" \
            --build "${{ steps.version.outputs.build }}" \
            --signing "$([[ "$RELEASE" == "true" ]] && echo developer-id || echo adhoc)" \
            --out "$RUNNER_TEMP/build"

      # Order matters: notarize the app and staple its ticket, and only then
      # pack the ZIP and the DMG around it, so both carry a stapled app.
      - name: Notarize the app
        if: env.RELEASE == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: uv run scripts/release/release.py notarize "$RUNNER_TEMP/build/$APP_NAME.app"

      - name: Package the ZIP and the DMG
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          uv run scripts/release/release.py zip "$RUNNER_TEMP/build/$APP_NAME.app" "dist/$APP_NAME-$V.zip"
          if [[ "$RELEASE" == "true" ]]; then
            uv run scripts/release/release.py dmg "$RUNNER_TEMP/build/$APP_NAME.app" "dist/$APP_NAME-$V.dmg" --sign
          else
            uv run scripts/release/release.py dmg "$RUNNER_TEMP/build/$APP_NAME.app" "dist/$APP_NAME-$V.dmg"
          fi

      # The DMG is notarized in its own right too, so a downloaded image opens
      # without a trip to Apple's servers.
      - name: Notarize the DMG
        if: env.RELEASE == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          uv run scripts/release/release.py notarize "dist/$APP_NAME-$V.dmg"
          # A name without the version, so the site can always link to
          # releases/latest/download/Errol.dmg.
          cp "dist/$APP_NAME-$V.dmg" "dist/$APP_NAME.dmg"

      - name: Verify
        if: env.RELEASE == 'true'
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          if [[ -f Config/designated-requirement.txt ]]; then
            scripts/verify-artifact.sh "$RUNNER_TEMP/build/$APP_NAME.app" --golden Config/designated-requirement.txt
          else
            scripts/verify-artifact.sh "$RUNNER_TEMP/build/$APP_NAME.app"
          fi
          scripts/verify-artifact.sh "dist/$APP_NAME-$V.dmg"

      - name: Keep the dSYMs
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/build/$APP_NAME.xcarchive/dSYMs" \
            "dist/$APP_NAME-${{ steps.version.outputs.version }}-dSYMs.zip"

      - name: Write the update feed
        if: env.RELEASE == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          # Release notes in docs/release-notes/ show in the update window.
          NOTES="docs/release-notes/$V.md"
          [[ -f "$NOTES" ]] || NOTES=""
          # The key goes in on standard input, so it's never written to disk
          # where a later step could pick it up.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | uv run scripts/release/release.py appcast \
            "dist/$APP_NAME-$V.zip" --tag "v$V" --out dist --key-file - ${NOTES:+--notes "$NOTES"}
          xmllint --noout dist/appcast.xml

      - name: Publish the prerelease
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          if [[ -f "docs/release-notes/$V.md" ]]; then
            gh release create "v$V" --prerelease --verify-tag --title "Errol $V" \
              --notes-file "docs/release-notes/$V.md" dist/*
          else
            gh release create "v$V" --prerelease --verify-tag --title "Errol $V" --generate-notes dist/*
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Errol $V is a prerelease

          Before approving the publish job, update a real copy of Errol to it:

          \`\`\`
          defaults write com.t7m8.Errol SUFeedURL https://github.com/${{ github.repository }}/releases/download/v$V/appcast.xml
          \`\`\`

          Then choose Check for Updates, confirm the Accessibility grant survived and a relay runs, and run
          \`defaults delete com.t7m8.Errol SUFeedURL\`.
          EOF

      - name: Keep the dry run's builds
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: errol-dry-run
          path: dist/

  publish:
    name: Publish (after the update test)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The environment requires a reviewer, and the approval is the update
    # test: approving without trying the prerelease defeats the point of it.
    environment: release-publish
    permissions:
      contents: write
    steps:
      - name: Make the prerelease the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v${{ needs.build.outputs.version }}" \
            --repo "${{ github.repository }}" --prerelease=false --latest

      - name: Check the live feed
        run: |
          set -euo pipefail
          BUILD="${{ needs.build.outputs.build }}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL https://errol.chat/appcast.xml | grep -q "<sparkle:version>$BUILD</sparkle:version>"; then
              echo "errol.chat/appcast.xml offers build $BUILD."
              exit 0
            fi
            sleep 10
          done
          echo "::error::errol.chat/appcast.xml doesn't offer build $BUILD yet."
          exit 1
