name: Release

# Tag push builds, signs, notarizes and verifies -- then stops at a DRAFT
# release. Publishing is a separate, manually approved job, because the one
# thing CI cannot check is whether a real Sparkle update preserves a real
# user's Accessibility grant. That smoke test happens between the two jobs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.1.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned deliberately. Bump it as a reviewed change, never with a floating tag.
  SPARKLE_VERSION: "2.9.6"
  APP_NAME: "Errol"
  BUNDLE_ID: "com.t7m8.Errol"
  XCODE_PROJECT: "app/Errol/Errol.xcodeproj"

jobs:
  build:
    name: Build, sign, notarize
    runs-on: macos-latest
    outputs:
      marketing_version: ${{ steps.version.outputs.marketing }}
      build_number: ${{ steps.version.outputs.build }}
    steps:
      # fetch-depth: 0 is required, not cosmetic. The build number is the
      # commit count, and GitHub's default shallow checkout would make it 1
      # on every release -- a CFBundleVersion that never advances and a
      # Sparkle feed that silently never offers an update.
      - uses: actions/checkout@v4  # TODO pin to a commit SHA
        with:
          fetch-depth: 0

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          # Do not pin an exact app path -- runner images rename these often.
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -switch "$NEWEST"
          xcodebuild -version

      # Tests run before anything is signed. A build that cannot pass its own
      # detection contract has no business being notarized.
      - name: Run contract tests
        run: swift test

      - name: Derive version numbers
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MARKETING="${{ inputs.version }}"
          else
            MARKETING="${GITHUB_REF_NAME#v}"
          fi
          BUILD="$(git rev-list --count HEAD)"

          if [[ "$BUILD" -le 1 ]]; then
            echo "::error::Build number is $BUILD -- the checkout is shallow. fetch-depth: 0 is missing."
            exit 1
          fi

          # Sparkle compares CFBundleVersion. If this release does not exceed
          # what the live feed already advertises, clients would never see it.
          LIVE_FEED="https://raw.githubusercontent.com/${{ github.repository }}/main/appcast.xml"
          LATEST="$(curl -fsSL "$LIVE_FEED" 2>/dev/null \
            | grep -oE 'sparkle:version="[0-9]+"' \
            | grep -oE '[0-9]+' | sort -n | tail -1 || true)"
          if [[ -n "${LATEST:-}" && "$BUILD" -le "$LATEST" ]]; then
            echo "::error::Build number $BUILD does not exceed the published feed's $LATEST."
            exit 1
          fi

          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"         >> "$GITHUB_OUTPUT"
          echo "Building $MARKETING (build $BUILD), previous published build: ${LATEST:-none}"

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        run: |
          set -euo pipefail
          # Config/Release.xcconfig is the single source for the distribution
          # identity, but the target already sets CODE_SIGN_IDENTITY and
          # DEVELOPMENT_TEAM in project.pbxproj and target settings beat a base
          # configuration file. Command-line settings beat both, so the config
          # is parsed into arguments here rather than passed with -xcconfig.
          SETTINGS=()
          while IFS= read -r line; do
            [[ "$line" =~ ^[A-Z_]+[[:space:]]*= ]] || continue
            key="${line%%=*}"; value="${line#*=}"
            SETTINGS+=("$(echo "$key" | xargs)=$(echo "$value" | xargs)")
          done < Config/Release.xcconfig

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            "${SETTINGS[@]}" \
            | { command -v xcbeautify >/dev/null && xcbeautify || cat; }
          exit "${PIPESTATUS[0]}"

      - name: Export
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>JN3SN725AZ</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      # Order matters: notarize the app, staple the app, and only then build
      # the ZIP. A ZIP cannot carry a stapled ticket itself -- it has to
      # contain an app that already has one.
      - name: Notarize and staple the app
        env:
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/export/$APP_NAME.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$RUNNER_TEMP/export/$APP_NAME.app"
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize.zip"

      - name: Package ZIP for Sparkle and DMG for humans
        env:
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p dist
          V="${{ steps.version.outputs.marketing }}"

          # ZIP: the Sparkle enclosure. Contains the already-stapled app.
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/export/$APP_NAME.app" "dist/$APP_NAME-$V.zip"

          # DMG: the first-run install experience, with a drop target.
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$RUNNER_TEMP/export/$APP_NAME.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGE" \
            -ov -format UDZO "dist/$APP_NAME-$V.dmg"

          # The DMG is notarized and stapled in its own right, so a downloaded
          # disk image opens without a network round trip.
          codesign --sign "Developer ID Application" --timestamp "dist/$APP_NAME-$V.dmg"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "dist/$APP_NAME-$V.dmg" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m
          xcrun stapler staple "dist/$APP_NAME-$V.dmg"
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Verify artifacts
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.marketing }}"
          GOLDEN=""
          if [[ -f Config/designated-requirement.txt ]]; then
            GOLDEN="--golden Config/designated-requirement.txt"
          fi
          # shellcheck disable=SC2086
          scripts/verify-artifact.sh "$RUNNER_TEMP/export/$APP_NAME.app" $GOLDEN
          scripts/verify-artifact.sh "dist/$APP_NAME-$V.dmg"

      - name: Preserve dSYMs
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.marketing }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/$APP_NAME.xcarchive/dSYMs" "dist/$APP_NAME-$V-dSYMs.zip"

      - name: Generate appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # TODO: add a checksum assertion on this download before first use:
          #   shasum -a 256 Sparkle.tar.xz
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          BIN="$RUNNER_TEMP/sparkle/bin"

          # generate_appcast needs every archive it should describe, so pull
          # the previously published ZIPs alongside the new one.
          mkdir -p "$RUNNER_TEMP/updates"
          cp dist/*.zip "$RUNNER_TEMP/updates/" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/updates/"*-dSYMs.zip
          for tag in $(gh release list --limit 20 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --dir "$RUNNER_TEMP/updates" --pattern "*.zip" --clobber 2>/dev/null || true
          done
          rm -f "$RUNNER_TEMP/updates/"*-dSYMs.zip

          # --ed-key-file - reads the key from stdin, so the private half is
          # never written to the runner's disk where a later step, a cache
          # action, or an uploaded artifact could pick it up.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.marketing }}/" \
            --maximum-versions 5 \
            "$RUNNER_TEMP/updates"
          cp "$RUNNER_TEMP/updates/appcast.xml" dist/appcast.xml
          xmllint --noout dist/appcast.xml && echo "appcast well-formed"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.marketing }}"
          gh release create "v$V" \
            --draft \
            --title "Errol $V" \
            --notes "Build ${{ steps.version.outputs.build }}. Draft pending the manual update smoke test." \
            "dist/$APP_NAME-$V.zip" \
            "dist/$APP_NAME-$V.dmg" \
            "dist/$APP_NAME-$V-dSYMs.zip" \
            "dist/appcast.xml"

  promote:
    name: Publish (manual gate)
    needs: build
    runs-on: macos-latest
    # This environment must require a reviewer. The approval IS the smoke test:
    # install the drafted build over the previous one through Sparkle on a real
    # Mac, confirm the Accessibility grant survived and a relay still runs, then
    # approve. Approving without doing that defeats the entire design.
    environment: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4  # TODO pin to a commit SHA
        with:
          ref: main

      - name: Publish release and update the live feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ needs.build.outputs.marketing_version }}"
          gh release download "v$V" --pattern "appcast.xml" --dir . --clobber
          gh release edit "v$V" --draft=false

          # The feed is published last. Until this commit lands, no installed
          # copy of Errol can see the new version.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Publish appcast for $V" || { echo "appcast unchanged"; exit 0; }
          git push origin main
