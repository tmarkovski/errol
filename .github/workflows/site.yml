name: Deploy Errol site

# This workflow is the only deploy path for the site. Do not also connect the
# repository under the Worker's Build settings in the Cloudflare dashboard, or
# both systems will deploy the same Worker on every push. Missing credentials
# fail the run on purpose: a green check on main must mean the site shipped.
#
# Wrangler is called directly rather than through cloudflare/wrangler-action so
# the deploy uses the exact version pinned in site/package-lock.json.
#
# The promo films on the page aren't in git. The films jobs, one per cut, keep
# them in R2 under a hash of their source (site/scripts/promo-film/films.sh) and
# render them only when that hash is new; the deploy job fetches them before the
# build.
# Dispatched on a branch other than main, the workflow runs only the films job,
# which renders a changed film without shipping it.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Wrangler reads these two directly; no action-specific inputs needed.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: "false"

jobs:
  films:
    name: films (${{ matrix.format }})
    # The cuts render side by side, each on its own runner, in about 17 minutes.
    strategy:
      matrix:
        format: [tall, wide]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A newer run waits for a render in progress instead of cancelling it, then finds the film stored.
    concurrency:
      group: errol-promo-films-${{ matrix.format }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    steps:
      - name: Require Cloudflare credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        working-directory: .
        run: |
          echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets. This workflow is the site's only deploy path, so it fails instead of skipping."
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Look for this source's film in R2
        id: stored
        run: |
          scripts/promo-film/films.sh bucket
          if scripts/promo-film/films.sh stored ${{ matrix.format }}; then
            echo "The ${{ matrix.format }} film for $(scripts/promo-film/films.sh key) is stored; nothing to render."
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.stored.outputs.hit != 'true'
      - name: Render the film
        if: steps.stored.outputs.hit != 'true'
        run: |
          uv run scripts/promo-film/render.py build --format ${{ matrix.format }} --workers 4
          uv run scripts/promo-film/render.py publish --format ${{ matrix.format }}
      - name: Store the film in R2
        if: steps.stored.outputs.hit != 'true'
        run: scripts/promo-film/films.sh store ${{ matrix.format }}
      # The render is also on the run's page, to watch without R2 access.
      - uses: actions/upload-artifact@v7
        if: steps.stored.outputs.hit != 'true'
        with:
          name: promo-film-${{ matrix.format }}
          path: site/public/demos/
          retention-days: 14
          compression-level: 0

  deploy:
    needs: films
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: errol-site-production
      cancel-in-progress: true
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Fetch the promo films
        run: scripts/promo-film/films.sh fetch
      - run: npm run build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
