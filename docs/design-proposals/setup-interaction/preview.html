<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Errol · Participatory setup preview</title>
<style>
  :root { color-scheme:light dark; background:light-dark(#ffffff,#181818); }
  body { margin:0; padding:16px; }
</style>
<script src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
</head>
<body>
<div id="errol-setup-walkthrough" aria-label="Errol participatory setup mock screens">
  <style>
    #errol-setup-walkthrough {
      --er-paper:light-dark(#fbfaf8,#1b1a18); --er-well:light-dark(#f3f1ec,#232220);
      --er-ink:light-dark(#1c1b19,#f2f0eb); --er-secondary:light-dark(#4a4845,#c8c5be);
      --er-edge:light-dark(#e2dfd8,#373532); --er-accent:light-dark(#5e7044,#b6cd91);
      --er-on-accent:light-dark(#ffffff,#222c17); --er-soft:light-dark(#e9efdf,#35422b);
      --er-gold:light-dark(#b87b24,#edbd68); --er-gold-back:light-dark(#fff2d7,#463820);
      --er-clay:light-dark(#a55439,#e2a58b); --er-clay-back:light-dark(#f5e7df,#47332b);
      --er-desktop:light-dark(#d2d8ce,#272e29); --er-sky:light-dark(#e4e6dc,#384439);
      --er-white:light-dark(#ffffff,#242624); --er-chat:light-dark(#fafaf8,#202321);
      --er-claude:light-dark(#f9f6ee,#26241f); --er-shadow:light-dark(#252d2526,#00000060);
      --er-traffic-red:light-dark(#d88a7e,#bc7067); --er-traffic-yellow:light-dark(#d9bc70,#bfa462);
      --er-traffic-green:light-dark(#93ae82,#79956a);
      --er-shell-radius:999px;
      color:var(--er-ink); font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      font-size:13px; line-height:1.45; width:100%; background:transparent; container-type:inline-size;
      -webkit-font-smoothing:antialiased;
    }
    #errol-setup-walkthrough * { box-sizing:border-box; }
    #errol-setup-walkthrough button, #errol-setup-walkthrough input, #errol-setup-walkthrough textarea, #errol-setup-walkthrough select { font:inherit; }
    #errol-setup-walkthrough button { cursor:pointer; }
    #errol-setup-walkthrough button:disabled { cursor:default; opacity:.45; }
    #errol-setup-walkthrough h2, #errol-setup-walkthrough h3, #errol-setup-walkthrough p { margin:0; font-family:inherit; font-style:normal; }
    #errol-setup-walkthrough svg[data-lucide] { width:17px; height:17px; flex-shrink:0; }
    #errol-setup-walkthrough .er-storyhead { display:flex; align-items:center; justify-content:space-between; gap:14px; margin:0 0 12px; }
    #errol-setup-walkthrough .er-storyhead span { color:var(--er-secondary); font-size:12px; }
    #errol-setup-walkthrough .er-storyhead strong { font-weight:500; }
    #errol-setup-walkthrough .er-navbuttons { display:flex; gap:6px; flex-shrink:0; }
    #errol-setup-walkthrough .er-navbutton { border:1px solid var(--er-edge); background:var(--er-paper); color:var(--er-ink); border-radius:8px; padding:6px 10px; display:flex; align-items:center; gap:6px; }
    #errol-setup-walkthrough .er-desktop { position:relative; min-height:660px; border-radius:15px; overflow:hidden; background:radial-gradient(ellipse at 94% 25%,var(--er-sky),transparent 58%),linear-gradient(130deg,var(--er-desktop),var(--er-sky)); border:1px solid var(--er-edge); }
    #errol-setup-walkthrough .er-menubar { height:31px; display:flex; align-items:center; justify-content:space-between; padding:0 17px; gap:12px; background:var(--er-sky); border-bottom:1px solid color-mix(in srgb,var(--er-ink) 9%,transparent); font-size:11px; position:relative; z-index:20; }
    #errol-setup-walkthrough .er-menu-left, #errol-setup-walkthrough .er-menu-right { display:flex; align-items:center; gap:18px; white-space:nowrap; }
    #errol-setup-walkthrough .er-menu-left b { font-weight:500; font-size:12px; }
    #errol-setup-walkthrough .er-symbol { width:19px; height:19px; object-fit:contain; }
    @media(prefers-color-scheme:dark) { #errol-setup-walkthrough .er-symbol { filter:invert(1); } }
    #errol-setup-walkthrough .er-stage { position:relative; padding:22px 25px 24px; min-height:625px; }
    #errol-setup-walkthrough .er-widget { position:relative; z-index:12; margin:0 auto; width:min(100%,860px); background:var(--er-paper); border:1px solid var(--er-edge); border-radius:var(--er-shell-radius); box-shadow:0 12px 30px var(--er-shadow),0 2px 5px var(--er-shadow),inset 0 1px 0 color-mix(in srgb,var(--er-white) 70%,transparent); padding:12px 28px; display:grid; grid-template-columns:72px minmax(0,1fr) 72px; gap:14px; align-items:center; min-height:156px; }
    #errol-setup-walkthrough .er-participant { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; }
    #errol-setup-walkthrough .er-perch { position:relative; display:grid; place-items:center; width:42px; height:42px; padding:0; border:0; background:transparent; color:var(--er-ink); }
    #errol-setup-walkthrough .er-perch[data-interactive="true"]:not(:disabled):hover .er-appicon { filter:brightness(.92); }
    #errol-setup-walkthrough .er-perch[data-draggable="true"] { cursor:grab; touch-action:none; }
    #errol-setup-walkthrough .er-perch[data-draggable="true"]:active { cursor:grabbing; }
    #errol-setup-walkthrough.er-is-dragging, #errol-setup-walkthrough.er-is-dragging * { cursor:grabbing!important; user-select:none; }
    #errol-setup-walkthrough .er-appicon { width:42px; height:42px; object-fit:contain; pointer-events:none; user-select:none; transition:filter .12s ease-out; }
    #errol-setup-walkthrough .er-perch[data-open="false"] .er-appicon { opacity:.45; }
    #errol-setup-walkthrough .er-perch[data-revealing="true"] .er-appicon { animation:er-icon-reveal .22s ease-out both; }
    @keyframes er-icon-reveal { from { opacity:.45; } to { opacity:1; } }
    #errol-setup-walkthrough .er-perch[data-opening="true"]:disabled { opacity:1; }
    #errol-setup-walkthrough .er-perch[data-opening="true"] .er-appicon { animation:er-launch-bounce 1s linear infinite; }
    @keyframes er-launch-bounce {
      0%,60%,84%,100% { transform:translateY(0); animation-timing-function:cubic-bezier(.333,.667,.667,1); }
      30% { transform:translateY(-12px); animation-timing-function:cubic-bezier(.333,0,.667,.333); }
      72% { transform:translateY(-4px); animation-timing-function:cubic-bezier(.333,0,.667,.333); }
    }
    #errol-setup-walkthrough .er-miniicon { width:23px; height:23px; object-fit:contain; flex-shrink:0; }
    #errol-setup-walkthrough .er-presence { position:absolute; right:0; bottom:1px; display:grid; place-items:center; width:18px; height:18px; border-radius:50%; color:var(--er-on-accent); background:var(--er-accent); border:2px solid var(--er-paper); }
    #errol-setup-walkthrough .er-presence svg[data-lucide] { width:11px; height:11px; }
    #errol-setup-walkthrough .er-perchname { font-weight:500; font-size:12px; }
    #errol-setup-walkthrough .er-name-slot { position:relative; display:block; width:100%; height:17px; overflow:hidden; text-align:center; }
    #errol-setup-walkthrough .er-name-slot>span { position:absolute; inset:0; display:grid; place-items:center; white-space:nowrap; transition:transform .18s ease-in-out; }
    #errol-setup-walkthrough .er-open-hint { font-size:11px; font-weight:400; color:var(--er-secondary); transform:translateY(-100%); }
    #errol-setup-walkthrough .er-name-slot.er-show-open-hint .er-label-name { transform:translateY(100%); }
    #errol-setup-walkthrough .er-name-slot.er-show-open-hint .er-open-hint { transform:translateY(0); }
    #errol-setup-walkthrough .er-perchstate { font-size:11px; color:var(--er-secondary); text-align:center; }
    #errol-setup-walkthrough .er-widget-center { min-width:0; border-left:1px solid var(--er-edge); border-right:1px solid var(--er-edge); padding:0 18px; }
    #errol-setup-walkthrough .er-eyebrow { display:flex; align-items:center; flex-wrap:wrap; gap:7px; color:var(--er-secondary); font-size:11px; margin-bottom:5px; letter-spacing:0; }
    #errol-setup-walkthrough .er-setup-progress { position:relative; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); align-items:center; gap:5px; width:124px; max-width:100%; height:6px; margin-bottom:12px; }
    #errol-setup-walkthrough .er-progress-hit { display:grid; align-items:center; width:100%; height:24px; margin:-9px 0; padding:0; border:0; border-radius:4px; background:transparent; }
    #errol-setup-walkthrough .er-progress-hit:disabled { opacity:1; }
    #errol-setup-walkthrough .er-progress-hit:not(:disabled):hover .er-progress-step { filter:brightness(.85); }
    #errol-setup-walkthrough .er-progress-step { display:block; width:100%; height:4px; border-radius:3px; background:var(--er-edge); transition:background .3s ease-in-out; }
    #errol-setup-walkthrough .er-progress-step.er-done { background:var(--er-accent); }
    #errol-setup-walkthrough .er-progress-current { position:absolute; top:0; left:calc(var(--er-current-step) * ((100% - 15px) / 4 + 5px)); width:calc((100% - 15px) / 4); height:6px; border-radius:3px; background:var(--er-gold); pointer-events:none; }
    #errol-setup-walkthrough .er-progress-departing { animation:er-progress-depart .3s ease-in-out both; }
    #errol-setup-walkthrough .er-progress-arriving { animation:er-progress-arrive .3s ease-in-out var(--er-progress-delay,-.15s) both; }
    #errol-setup-walkthrough .er-progress-revisiting { animation:er-progress-revisit .3s ease-in-out both; }
    @keyframes er-progress-depart { from { transform:translateX(0); } to { transform:translateX(calc(100% + 5px)); } }
    @keyframes er-progress-arrive { from { transform:translateX(calc(-100% - 5px)); } to { transform:translateX(0); } }
    @keyframes er-progress-revisit { from { transform:translateX(calc(var(--er-progress-distance) * (100% + 5px))); } to { transform:translateX(0); } }
    #errol-setup-walkthrough .er-setup-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:25px; margin-bottom:6px; }
    #errol-setup-walkthrough .er-setup-toolbar .er-setup-progress { margin:0; }
    #errol-setup-walkthrough .er-configure { position:relative; margin-left:auto; flex-shrink:0; text-align:left; }
    #errol-setup-walkthrough .er-configure summary { display:grid; place-items:center; width:29px; height:29px; padding:0; border-radius:50%; color:var(--er-secondary); cursor:pointer; list-style:none; }
    #errol-setup-walkthrough .er-configure summary::-webkit-details-marker { display:none; }
    #errol-setup-walkthrough .er-configure summary:hover, #errol-setup-walkthrough .er-configure[open] summary { background:var(--er-well); color:var(--er-ink); }
    #errol-setup-walkthrough .er-configure summary svg[data-lucide] { width:15px; height:15px; }
    #errol-setup-walkthrough .er-configure-menu { position:absolute; top:calc(100% + 6px); right:0; z-index:30; width:192px; padding:14px; border:1px solid var(--er-edge); border-radius:10px; background:var(--er-paper); box-shadow:0 8px 24px var(--er-shadow); color:var(--er-secondary); font-size:12px; }
    #errol-setup-walkthrough .er-widget h2 { font-size:19px; font-weight:500; letter-spacing:-.2px; line-height:1.25; }
    #errol-setup-walkthrough .er-sub { color:var(--er-secondary); font-size:12px; margin-top:5px; line-height:1.4; }
    #errol-setup-walkthrough .er-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px; }
    #errol-setup-walkthrough .er-connect-instructions { position:relative; padding-left:30px; }
    #errol-setup-walkthrough .er-connect-claude .er-connect-instructions { padding-left:0; padding-right:30px; }
    #errol-setup-walkthrough .er-connect-claude.er-mirrored .er-drag-copy { text-align:right; }
    #errol-setup-walkthrough .er-connect-claude.er-mirrored .er-eyebrow,
    #errol-setup-walkthrough .er-connect-claude.er-mirrored .er-actions { justify-content:flex-end; }
    #errol-setup-walkthrough .er-drag-cue { --er-cue-x:-7px; --er-cue-y:0px; position:absolute; top:29px; left:-10px; display:grid; place-items:center; width:30px; height:30px; color:var(--er-gold); pointer-events:none; }
    #errol-setup-walkthrough .er-drag-cue svg[data-lucide] { width:29px; height:29px; }
    #errol-setup-walkthrough .er-connect-claude .er-drag-cue { --er-cue-x:7px; left:auto; right:-10px; }
    #errol-setup-walkthrough .er-drag-cue.er-nudge { animation:er-setup-drag-nudge .9s ease-in-out .2s 3; }
    #errol-setup-walkthrough.er-is-dragging .er-drag-cue { opacity:0; animation:none; }
    @keyframes er-setup-drag-nudge { 0%,100% { transform:translate(0,0); } 45% { transform:translate(var(--er-cue-x),var(--er-cue-y)); } }
    #errol-setup-walkthrough .er-button { padding:5px 11px; min-height:29px; border:1px solid var(--er-edge); border-radius:7px; display:inline-flex; align-items:center; justify-content:center; gap:6px; background:linear-gradient(var(--er-white),var(--er-paper)); box-shadow:0 1px 2px var(--er-shadow); color:var(--er-ink); font-size:12px; font-weight:500; text-decoration:none; }
    #errol-setup-walkthrough .er-button:hover { background:var(--er-well); }
    #errol-setup-walkthrough .er-button.er-primary { background:var(--er-accent); color:var(--er-on-accent); border-color:var(--er-accent); }
    #errol-setup-walkthrough .er-button.er-primary:hover { filter:brightness(.95); }
    #errol-setup-walkthrough .er-textbutton { background:transparent; border:0; border-radius:6px; padding:5px 7px; min-height:29px; display:inline-flex; align-items:center; gap:5px; color:var(--er-secondary); font-size:12px; text-decoration:none; }
    #errol-setup-walkthrough .er-textbutton:hover { background:var(--er-well); }
    #errol-setup-walkthrough .er-widget .er-primary { border-radius:999px; padding-inline:14px; }
    #errol-setup-walkthrough .er-countdown { position:relative; overflow:hidden; isolation:isolate; font-variant-numeric:tabular-nums; }
    #errol-setup-walkthrough .er-countdown::before { content:''; position:absolute; inset:0; z-index:-1; background:color-mix(in srgb,var(--er-on-accent) 20%,transparent); transform:scaleX(var(--er-countdown-progress,0)); transform-origin:left; pointer-events:none; }
    #errol-setup-walkthrough .er-step-out { animation:er-step-out .15s ease-in both; pointer-events:none; }
    #errol-setup-walkthrough .er-step-in { animation:er-step-in .15s ease-out both; }
    @keyframes er-step-out { to { opacity:0; } }
    @keyframes er-step-in { from { opacity:0; } to { opacity:1; } }
    #errol-setup-walkthrough .er-status { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--er-accent); }
    #errol-setup-walkthrough .er-status svg[data-lucide] { width:13px; height:13px; }
    #errol-setup-walkthrough .er-setupdetail { position:relative; z-index:11; margin:13px auto 0; max-width:584px; border:1px solid var(--er-edge); border-radius:15px; padding:15px 19px; background:var(--er-paper); box-shadow:0 5px 16px var(--er-shadow); }
    #errol-setup-walkthrough .er-setupdetail:empty { display:none; }
    #errol-setup-walkthrough .er-layouts { display:flex; flex-wrap:wrap; gap:7px; }
    #errol-setup-walkthrough .er-layout { display:inline-flex; align-items:center; gap:5px; min-height:29px; border:1px solid var(--er-edge); border-radius:7px; padding:5px 8px; color:var(--er-ink); background:linear-gradient(var(--er-white),var(--er-paper)); box-shadow:0 1px 2px var(--er-shadow); font-size:11px; }
    #errol-setup-walkthrough .er-layout:hover { background:var(--er-well); }
    #errol-setup-walkthrough .er-layout[aria-pressed="true"] { border-color:var(--er-accent); background:var(--er-soft); color:var(--er-accent); box-shadow:none; }
    #errol-setup-walkthrough .er-layout svg[data-lucide] { width:14px; height:14px; }
    #errol-setup-walkthrough .er-layout-check { display:flex; width:11px; visibility:hidden; }

    #errol-setup-walkthrough .er-layout[aria-pressed="true"] .er-layout-check { visibility:visible; }
    #errol-setup-walkthrough .er-destinations { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    #errol-setup-walkthrough .er-destination { min-width:0; display:flex; align-items:flex-start; gap:8px; }
    #errol-setup-walkthrough .er-destination strong { display:block; font-size:12px; font-weight:500; }
    #errol-setup-walkthrough .er-destination span { font-size:11px; color:var(--er-secondary); display:block; }
    #errol-setup-walkthrough .er-context { border-top:1px solid var(--er-edge); margin-top:11px; padding-top:10px; color:var(--er-secondary); font-size:11px; }
    #errol-setup-walkthrough .er-compose { display:block; width:100%; border:0; border-radius:0; resize:none; height:44px; min-height:44px; background:transparent; color:var(--er-ink); font-size:16px; line-height:1.35; padding:0; }
    #errol-setup-walkthrough .er-shape { border:0; border-radius:6px; background:var(--er-well); color:var(--er-secondary); font-size:11px; padding:4px 6px; max-width:145px; }
    #errol-setup-walkthrough .er-composer-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:5px 12px; margin-bottom:5px; }
    #errol-setup-walkthrough .er-composer-head .er-setup-progress { margin:0; width:104px; }
    #errol-setup-walkthrough .er-inlinehint { font-size:11px; line-height:1.35; color:var(--er-secondary); margin-top:5px; }
    #errol-setup-walkthrough .er-arrange-row { display:flex; align-items:center; gap:10px; margin-top:11px; flex-wrap:wrap; }
    #errol-setup-walkthrough .er-arrange-row>.er-button { margin-left:auto; }
    #errol-setup-walkthrough .er-widget.er-permission-shell { grid-template-columns:56px minmax(0,1fr) 196px; }
    #errol-setup-walkthrough .er-access-badge { display:flex; flex-direction:column; align-items:center; gap:7px; }
    #errol-setup-walkthrough .er-access-symbol { display:grid; place-items:center; width:44px; height:44px; border-radius:50%; background:var(--er-soft); color:var(--er-accent); }
    #errol-setup-walkthrough .er-access-symbol svg[data-lucide] { width:24px; height:24px; }
    #errol-setup-walkthrough .er-access-dot { width:5px; height:5px; border-radius:50%; background:var(--er-clay); }
    #errol-setup-walkthrough .er-access-copy { min-width:0; border-left:1px solid var(--er-edge); padding-left:18px; }
    #errol-setup-walkthrough .er-access-actions { display:flex; flex-direction:column; align-items:flex-end; gap:7px; }
    #errol-setup-walkthrough .er-access-actions .er-button { min-height:35px; font-size:11px; }
    #errol-setup-walkthrough .er-access-actions .er-inlinehint { margin:0; display:flex; align-items:center; gap:4px; }
    #errol-setup-walkthrough .er-access-actions svg[data-lucide] { width:12px; height:12px; }
    #errol-setup-walkthrough .er-windows { position:relative; z-index:3; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:19px; margin-top:37px; transition:gap .25s; }

    #errol-setup-walkthrough .er-window { min-width:0; min-height:337px; border-radius:12px; border:1px solid color-mix(in srgb,var(--er-ink) 20%,transparent); background:var(--er-chat); box-shadow:0 10px 22px var(--er-shadow); position:relative; display:flex; flex-direction:column; transition:transform .25s,box-shadow .25s; }
    #errol-setup-walkthrough .er-window.er-claude { background:var(--er-claude); }

    #errol-setup-walkthrough .er-traffic i:nth-child(3) { background:var(--er-traffic-green); }

    #errol-setup-walkthrough .er-windowbar>svg { color:var(--er-secondary); }

    #errol-setup-walkthrough .er-appbrand { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:500; }
    #errol-setup-walkthrough .er-appbrand .er-mode { color:var(--er-secondary); margin-left:auto; font-size:11px; font-weight:400; }

    #errol-setup-walkthrough .er-appwelcome h3 { font-size:21px; font-weight:400; letter-spacing:-.5px; }
    #errol-setup-walkthrough .er-appwelcome span { color:var(--er-secondary); font-size:11px; }

        else if(action==='prepare-continue')continueFromPrepare();
        else if(action==='next'){if(state.scene===2){state.completedArrange=true;changeScene(nextConnectionScene(),true);}else changeScene(state.scene+1);}
        else if(action==='connection-continue'){if((state.scene===3&&state.connectedChat)||(state.scene===4&&state.connectedClaude))changeScene(nextConnectionScene(),true);}
        else if(action==='pick'){state.picking=true;state.dragPreview='ready';state.problem='';render();}
        else if(action==='connect-chatgpt'){state.connectedChat=true;changeScene(nextConnectionScene(),true);}
        else if(action==='connect-claude'){state.connectedClaude=true;changeScene(nextConnectionScene(),true);}
        else if(action==='show-draft'){state.attention=true;render();}
        else if(action==='different'){design.claude='New chat';state.attention=false;render();}
        else if(action==='send'){const text=root.querySelector('.er-compose');if(text&&text.value.trim())state.topic=text.value.trim();changeScene(6);}
        else if(action==='pause')changeScene(7);
        else if(action==='reply'){state.speaker=state.speaker==='chatgpt'?'claude':'chatgpt';render();}
        else if(action==='stop'){state.stopped=true;changeScene(8);}
        else if(action==='send-note'){const note=root.querySelector('.er-compose');if(note)state.note=note.value;state.noteSent=true;changeScene(6);}
        else if(action==='continue')changeScene(6);
        else if(action==='return')changeScene(9);
        else if(action==='fresh'){state.connectedChat=false;state.connectedClaude=false;design.claude='New chat';changeScene(3);}
        else if(action==='reconnect')changeScene(3);
      });
      document.addEventListener('click',event=>{
        root.querySelectorAll('.er-configure[open]').forEach(menu=>{if(!menu.contains(event.target))menu.open=false;});
      });
      root.addEventListener('keydown',event=>{
        if(event.key!=='Escape') return;
        const menu=root.querySelector('.er-configure[open]');
        if(menu){menu.open=false;menu.querySelector('summary').focus();event.preventDefault();}
      });
      root.addEventListener('change',event=>{
        if(event.target.dataset.action==='grant')changeScene(1);
        if(event.target.classList.contains('er-shape')){state.shape=event.target.value;const input=root.querySelector('.er-compose');if(input){if(state.scene===9)state.nextTopic=input.value;else state.topic=input.value;}render();}
      });
      root.addEventListener('input',event=>{
        if(event.target.classList.contains('er-compose')){
          if(state.scene===7)state.note=event.target.value;
          else {if(state.scene===9)state.nextTopic=event.target.value;else state.topic=event.target.value;const send=root.querySelector('[data-action="send"]');if(send)send.disabled=!event.target.value.trim();}
        }
      });
      // Pointer tracking leaves the icon in place: no browser image or text drag.
      function cancelPointerDrag() {
        const previous=pointerDrag;
        pointerDrag=null;
        if(previous?.source.hasPointerCapture(previous.id)) previous.source.releasePointerCapture(previous.id);
      }
      function finishConnection(side) {
        if(side==='chatgpt') { state.connectedChat=true; changeScene(nextConnectionScene(),true); }
        else if(design.claude==='Unsent draft') { state.picking=true; render(); }
        else { state.connectedClaude=true; changeScene(nextConnectionScene(),true); }
      }
      root.addEventListener('dragstart',event=>{if(event.target.closest('[data-side]'))event.preventDefault();});
      root.addEventListener('pointerdown',event=>{
        const source=event.target.closest('[data-draggable="true"]');
        if(!source || event.button!==0 || !event.isPrimary) return;
        cancelPointerDrag();
        pointerDrag={source,id:event.pointerId,side:source.dataset.side,origin:{x:event.clientX,y:event.clientY},point:{x:event.clientX,y:event.clientY},started:false};
        source.setPointerCapture(event.pointerId);
      });
      root.addEventListener('pointermove',event=>{
        if(!pointerDrag || event.pointerId!==pointerDrag.id) return;
        const point={x:event.clientX,y:event.clientY};
        if(!pointerDrag.started && Math.hypot(point.x-pointerDrag.origin.x,point.y-pointerDrag.origin.y)<4) return;
        event.preventDefault();
        pointerDrag.started=true; pointerDrag.point=point; state.dragPreview='ready'; state.problem='';
        root.querySelector('.er-connect-problem').hidden=true;
        root.querySelectorAll('[data-drag-preview]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.dragPreview==='ready')));
        drawConnections();
      });
      root.addEventListener('pointerup',event=>{
        if(!pointerDrag || event.pointerId!==pointerDrag.id) return;
        const {started,side}=pointerDrag;
        pointerDrag.point={x:event.clientX,y:event.clientY};
        const drag=started?dragPresentation():null;
        const overConsole=containsPoint(root.querySelector('.er-widget').getBoundingClientRect(),pointerDrag.point);
        cancelPointerDrag();
        if(!started) return;
        event.preventDefault();
        suppressIconClick=true; setTimeout(()=>{suppressIconClick=false;},0);
        state.dragPreview='ready';
        if(drag?.armed) finishConnection(side);
        else {
          state.problem=overConsole?'':`Drop onto the marked message field in ${side==='chatgpt'?'ChatGPT':'Claude'}, or click to choose a window.`;
          render();
        }
      });
      root.addEventListener('pointercancel',()=>{if(pointerDrag){cancelPointerDrag();state.dragPreview='ready';render();}});
      root.addEventListener('lostpointercapture',()=>{if(pointerDrag){cancelPointerDrag();state.dragPreview='ready';render();}});
      window.addEventListener('blur',()=>{if(pointerDrag){cancelPointerDrag();state.dragPreview='ready';render();}});
      root.addEventListener('keydown',event=>{
        if(event.key==='Escape' && (pointerDrag || state.dragPreview!=='ready' || state.picking)) {
          event.preventDefault(); cancelPointerDrag(); state.dragPreview='ready'; state.picking=false; state.problem=''; render();
          root.querySelector(`[data-side="${connectionSide()}"]`)?.focus({preventScroll:true});
        }
      });
      window.addEventListener('scroll',()=>{if(pointerDrag || state.dragPreview!=='ready')drawConnections();},{passive:true});
      changeScene(0);
      const observer=new ResizeObserver(()=>requestAnimationFrame(drawConnections));observer.observe(desktop);
      if(globalThis.Tweak){
        const tweak=new Tweak({container:root,onChange:render});
        tweak.addSelect(design,'shell',{label:'Main bar shape',options:['Capsule','Rounded corners']});
        tweak.addToggle(design,'demoNotes',{label:'Show demo explanations'});
        tweak.addSelect(design,'connection',{label:'Connection gesture',options:['Drag first','Picker first']});
        tweak.addToggle(design,'bouncingArrow',{label:'Bouncing arrow'});
        tweak.addToggle(design,'mirrorInstructions',{label:'Right-align Claude instructions'});
        tweak.addSelect(design,'claude',{label:'Claude destination',options:['Existing chat','New chat','Unsent draft','Code session']});
        tweak.addToggle(design,'narration',{label:'Running guidance'});
        tweak.addSelect(state,'speaker',{label:'Replying assistant',options:[{label:'ChatGPT',value:'chatgpt'},{label:'Claude',value:'claude'}]});
      }
    })();
  </script>
</div>
</body>
</html>
